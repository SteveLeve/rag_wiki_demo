name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Serve deterministic embeddings from ragkit.testing instead of calling Ollama.
  # This is what lets CI execute the whole notebook curriculum with no model
  # server and no multi-gigabyte downloads.
  RAG_FAKE_MODELS: "1"

jobs:
  conventions:
    name: Conventions (no services)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Notebook conventions
        run: python scripts/nb_lint.py
      - name: Documentation links
        run: python scripts/check_links.py
      - name: Unit tests, no PostgreSQL and no Ollama
        run: pytest -m "not postgres and not notebooks"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    env:
      RAG_PG_PORT: "5433"
      POSTGRES_PORT: "5433"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify pgvector is available
        run: |
          python - <<'EOF'
          import os, psycopg2
          conn = psycopg2.connect(host="localhost", port=int(os.environ["RAG_PG_PORT"]),
                                  dbname="rag_test_db", user="postgres", password="postgres")
          with conn.cursor() as cur:
              # The extension is named `vector`. `pgvector` is the project name, and
              # using it silently errored every PostgreSQL test in this suite for
              # months -- so assert it explicitly here.
              cur.execute("CREATE EXTENSION IF NOT EXISTS vector")
              cur.execute("SELECT extversion FROM pg_extension WHERE extname = 'vector'")
              print("pgvector", cur.fetchone()[0])
          conn.commit()
          EOF

      - name: Full test suite
        run: pytest -m "not notebooks" -ra

  notebooks:
    name: Notebook execution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    env:
      RAG_PG_PORT: "5433"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the advanced extra, CPU-only torch
        run: |
          python -m pip install --upgrade pip
          # sentence-transformers is needed by the reranking notebooks. The CPU
          # wheel index avoids pulling ~2GB of CUDA that no runner will use.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[test,advanced]"
      - name: Execute the full curriculum
        run: python scripts/run_notebooks.py
